<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .notes{
         display: flex;
         gap: 50px;
         justify-content:center;
        }
        .abc{
            width:50px;
            height: 25px;
            padding:10px;
            padding-top: 15px;
            border: 2px solid black;
            text-align: center;
        }
        .ac{
            width:50px;
            height: 25px;
            padding:10px;
            padding-top: 15px;
             border: 2px solid black;
             text-align: center; 
        }
        .ec{
            width:50px;
            height: 25px;
            padding:10px;
            padding-top: 15px;
             border: 2px solid black;
             text-align: center; 
        }
        .er{
            width:50px;
            height: 25px;
            padding:10px;
            padding-top: 15px;
            border: 2px solid black;
            text-align: center; 
        }

        .notes{
        padding: 100px;
        font-size: 20px;
        background-color: rgb(0, 255, 136);
        color: rgb(0, 0, 0);
        border: 4px solid black;
        border-radius: 2px;
        }

         /* Mobile screen */
        @media (min-width:620px){
       .notes {
        flex-direction: column;
        align-items: center;
        padding: 20px;
        border: 2px solid rgb(255, 45, 8);
        }
        .notes {
        width: 200px;
       }
      }
    </style>
</head>

<body> 
    <div class="notes">
        <notes class="abc"> box1</notes>
        <notes class="ac">box2</notes>
        <notes class="ec">box3</notes>
        <notes class="er">box4</notes>
    </div>
</body>
</html>
