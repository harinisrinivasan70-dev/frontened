<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tr:hover{
            transform: scale(1.1);
            transition: transform 5s ease;

        }
       .tra:hover{
         transform: rotate(350deg);
        transition: transform 5s ease;

       }
    </style>
</head>
<body>
   <img class="tr" src="tra.jpg" height="400px" width="500px">
   <img  class="tra" src="tra(2).jpg" height="400px" width="500px">
    
</body>
</html>
