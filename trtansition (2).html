<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .in:hover{
            transform: scale(1.2);
            transition: transform 5s ease;
        }
        .im:hover{
            transform: rotate(350deg);
            transition: transform 5s ease;
        }

    </style>
</head>
<body>
    <div class="in">
    <img src="tra.jpg" height="400px" width="500px"><br>
    <img src="flex image.jpg" height="400px" width="500px">
    </div>



    <div class="im">
    <img  src="tra(2).jpg" height="400px" width="500px"><br>
    <img src="flex image.jpg" height="400px" width="500px">
    </div>


    
</body>
</html>
