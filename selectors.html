<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Element selector */
        h1{
            background-color: rgb(204, 166, 243);
        }

        /* Class selector */
        .hi{
            background-color: red;
        }
        /* Id selector */
        #sec{
            color: green;
        }
        /* Universal selector */
        *{
            background-color: yellow;
        }
        /* Grouping selector */
        p,.hi{
            font-size: 10px;
        }
    </style>
    <link rel="stylesheet" href="style(2).css">
</head>
<body>
    <h1>Hello</h1>
    <p id="sec">Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat rerum harum amet vero, temporibus veniam quidem deleniti quam minima assumenda eligendi culpa dolores distinctio fuga facere expedita ab, explicabo magni.
    </p>
    <p>welcome to my world</p>
    <h1 class="hi">Byee World</h1>
    <img src="images.jpg">
     <pre>this is me </pre>
</body>
</html>
