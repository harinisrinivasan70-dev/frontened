<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            background-color: aquamarine;
            height: 100px;
            width: 300px;
            position: static;
        }
        .li{
            background-color: rgb(114, 172, 122);
            height: 100px;
            width: 300px;
            position: relative;
            left: 50px;
        }
        h3{
            background-color: rgb(238, 198, 138);
            height: 50px;
            width: 300px;
            position: absolute;
            left: 200px;
        }
        button{
            position: fixed;
            top: 500px;
            left: 500px;
        }
       

    </style>
</head>
<body>
    <div style="background-color: cyan;">
        <h2>hey babe</h2>
    </div>
    <div style=" background-color: rgb(190, 160, 160);">
        <p class="li">this is jenny</p>
    </div>

    <div style=" background-color: rgb(69, 228, 228);">
        <h3>heloo</h3>
    </div><br><br><br><br>
    
    <div style="background-color: brown; height: 5000px;width: 100px;">
      <button> fixed</button>  
 </div>


</body>
</html>
