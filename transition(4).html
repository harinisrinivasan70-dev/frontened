<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img:hover{
            transform: rotate(300deg);
            transition: transform 5s ease;
        }
        .ti:hover{
            transform: scale(1.2);
            transition: transform 5s ease;
        }

    </style>
</head>
<body>
    <img src="tra(3).jpg" height="500px" width="500px">
    <img class="ti" src="tra(3).jpg" height="500px" width="500px">
    
</body>
</html>
